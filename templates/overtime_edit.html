{% extends "base.html" %}
{% block title %}Edit Overtime — Staffing Board{% endblock %}
{% block content %}

<div class="topbar">
  <div>
    <h2>Edit Overtime</h2>
    <div class="subtitle">{{ record.first_name }} {{ record.last_name }} ({{ record.employee_code }}) &middot; {{ record.ot_date }}</div>
  </div>
  <a href="{{ url_for('overtime') }}" class="btn btn-ghost">← Back to log</a>
</div>

<div class="card" style="max-width:640px;">
  <form method="post">
    <div class="form-grid">
      <div class="field field-full emp-search" data-employee-search
           data-employees='{{ employees_options|tojson }}'>
        <label for="employee_search_ot_edit">Employee</label>
        <input type="text" id="employee_search_ot_edit" autocomplete="off" required
               placeholder="Type a name or code to search…"
               value="{{ record.first_name }} {{ record.last_name }} ({{ record.employee_code }})"
               data-role="emp-search-input">
        <input type="hidden" name="employee_id" value="{{ record.employee_id }}" data-role="emp-search-value">
        <div class="emp-search-results" data-role="emp-search-results"></div>
      </div>

      <div class="field">
        <label for="ot_date">Date</label>
        <input type="date" id="ot_date" name="ot_date" value="{{ record.ot_date }}" required>
      </div>

      <div class="field">
        <label for="hours">Hours</label>
        <input type="number" step="0.25" min="0" id="hours" name="hours" value="{{ record.hours }}" required>
      </div>

      <div class="field field-full">
        <label for="reason">Reason</label>
        <input type="text" id="reason" name="reason" value="{{ record.reason or '' }}" placeholder="e.g. Emergency callout">
      </div>

      <div class="field field-full">
        <label for="approved_by">Approved By</label>
        <input type="text" id="approved_by" name="approved_by" value="{{ record.approved_by or '' }}" placeholder="Manager name">
      </div>

      <div class="field field-full">
        <label for="notes">Notes</label>
        <input type="text" id="notes" name="notes" value="{{ record.notes or '' }}" placeholder="Optional">
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Save Changes</button>
      <a href="{{ url_for('overtime') }}" class="btn btn-ghost">Cancel</a>
    </div>
  </form>
</div>

{% endblock %}
